name: BigBillApp
options:
  bundleIdPrefix: com.bigbill
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  BigBillApp:
    type: application
    platform: iOS
    sources:
      - BigBillApp
    info:
      path: BigBillApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigbill.app
        INFOPLIST_FILE: BigBillApp/Info.plist
        GENERATE_INFOPLIST_FILE: false
        DEVELOPMENT_TEAM: ""
