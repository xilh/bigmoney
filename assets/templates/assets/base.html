{% load static %}
<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BigBill{% endblock %} · 个人资产管理</title>
    <meta name="description" content="BigBill 个人资产管理系统 — 资产配置、再平衡、持仓跟踪">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}?v=2026.2">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <h1>💰 BigBill</h1>
                <p>个人资产管理系统</p>
            </div>
            <nav class="sidebar-nav">
                <a href="{% url 'assets:dashboard' %}" class="nav-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    <span class="nav-icon">📊</span>
                    <span>仪表盘</span>
                </a>
                <a href="{% url 'assets:holdings' %}" class="nav-item {% if request.resolver_match.url_name == 'holdings' %}active{% endif %}">
                    <span class="nav-icon">💼</span>
                    <span>资产管理</span>
                </a>
                <a href="{% url 'assets:upload' %}" class="nav-item {% if request.resolver_match.url_name == 'upload' %}active{% endif %}">
                    <span class="nav-icon">📷</span>
                    <span>截图识别</span>
                </a>
                <a href="{% url 'assets:rebalance' %}" class="nav-item {% if request.resolver_match.url_name == 'rebalance' %}active{% endif %}">
                    <span class="nav-icon">⚖️</span>
                    <span>再平衡</span>
                </a>
                <a href="{% url 'assets:asset_list' %}" class="nav-item {% if request.resolver_match.url_name == 'asset_list' or request.resolver_match.url_name == 'asset_detail' or request.resolver_match.url_name == 'asset_detail_by_name' %}active{% endif %}">
                    <span class="nav-icon">📋</span>
                    <span>资产总览</span>
                </a>
                <a href="{% url 'assets:cashflow' %}" class="nav-item {% if request.resolver_match.url_name == 'cashflow' %}active{% endif %}">
                    <span class="nav-icon">💸</span>
                    <span>资金流向</span>
                </a>
                <a href="{% url 'assets:history' %}" class="nav-item {% if request.resolver_match.url_name == 'history' %}active{% endif %}">
                    <span class="nav-icon">📈</span>
                    <span>历史记录</span>
                </a>
                <a href="{% url 'assets:advisor' %}" class="nav-item {% if request.resolver_match.url_name == 'advisor' %}active{% endif %}">
                    <span class="nav-icon">🤖</span>
                    <span>AI 顾问</span>
                </a>
                <a href="{% url 'assets:checklist' %}" class="nav-item {% if request.resolver_match.url_name == 'checklist' %}active{% endif %}">
                    <span class="nav-icon">✅</span>
                    <span>定期检视</span>
                </a>
                <a href="{% url 'assets:decisions' %}" class="nav-item {% if request.resolver_match.url_name == 'decisions' %}active{% endif %}">
                    <span class="nav-icon">📒</span>
                    <span>决策日志</span>
                </a>
                <a href="{% url 'assets:settings' %}" class="nav-item {% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
                    <span class="nav-icon">⚙️</span>
                    <span>设置</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Mobile Toggle -->
    <button class="mobile-toggle" id="mobileToggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

    <!-- Global Sell Modal -->
    <div class="modal-overlay" id="globalSellModal">
        <div class="modal">
            <div class="modal-header">
                <h3>卖出 / 清仓 <span id="sellModalAssetName" style="font-size: 0.9em; font-weight: normal; color: var(--color-text-muted);"></span></h3>
                <button class="modal-close" onclick="closeSellModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="sellHoldingId">
                <div class="form-group">
                    <label class="form-label">卖出份额/数量 *</label>
                    <input type="number" class="form-control" id="sellQuantity" step="any" placeholder="输入卖出份额">
                    <div class="text-xs text-muted mt-1">当前持有: <span id="sellCurrentQty" class="font-mono">0</span> 份 <span style="color:var(--color-primary);cursor:pointer;margin-left:8px;text-decoration:underline;" onclick="document.getElementById('sellQuantity').value = document.getElementById('sellCurrentQty').textContent;">全部卖出</span></div>
                </div>
                <div class="form-group">
                    <label class="form-label">卖出总金额 (¥) *</label>
                    <input type="number" class="form-control" id="sellAmount" step="any" placeholder="输入卖出得到的总金额">
                </div>
                <div class="form-group">
                    <label class="form-label">卖出理由 <span class="text-xs text-muted">（写下原因，纳入决策日志）</span></label>
                    <select class="form-control" id="sellReasonPreset" onchange="onSellReasonPreset()" style="margin-bottom:6px;">
                        <option value="">— 选择常见信号（可选）—</option>
                        <option value="再平衡：超配减持回目标比例">再平衡：超配减持</option>
                        <option value="单票突破3%上限，减仓">单票突破3%上限</option>
                        <option value="投资逻辑破坏">投资逻辑破坏</option>
                        <option value="估值极端化">估值极端化</option>
                        <option value="管理层诚信问题">管理层诚信问题</option>
                        <option value="行业结构性变化">行业结构性变化</option>
                        <option value="发现更优机会，置换">更优机会置换</option>
                    </select>
                    <textarea class="form-control" id="sellReason" rows="2" placeholder="如：茅台失去提价能力，护城河逻辑破坏，故清仓"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeSellModal()">取消</button>
                <button class="btn btn-danger" id="btnConfirmSell" onclick="confirmSell()">确认卖出</button>
            </div>
        </div>
    </div>

    <script src="{% static 'assets/js/app.js' %}"></script>
    <script>
    function openSellModal(id, name, qty) {
        document.getElementById('sellHoldingId').value = id;
        document.getElementById('sellModalAssetName').textContent = '- ' + name;
        document.getElementById('sellCurrentQty').textContent = qty;
        document.getElementById('sellQuantity').value = '';
        document.getElementById('sellAmount').value = '';
        document.getElementById('sellReason').value = '';
        document.getElementById('sellReasonPreset').value = '';
        document.getElementById('globalSellModal').classList.add('active');
    }
    function closeSellModal() {
        document.getElementById('globalSellModal').classList.remove('active');
    }
    function onSellReasonPreset() {
        const preset = document.getElementById('sellReasonPreset').value;
        const box = document.getElementById('sellReason');
        if (preset && !box.value.trim()) box.value = preset;
    }
    function confirmSell() {
        const id = document.getElementById('sellHoldingId').value;
        const qty = parseFloat(document.getElementById('sellQuantity').value) || 0;
        const amt = parseFloat(document.getElementById('sellAmount').value) || 0;
        
        if (qty < 0 || amt <= 0) {
            if (typeof showToast === 'function') showToast('请输入有效的卖出金额，且份额不能为负', 'error');
            else alert('请输入有效的卖出金额，且份额不能为负');
            return;
        }
        
        const btn = document.getElementById('btnConfirmSell');
        btn.disabled = true;
        btn.textContent = '处理中...';
        
        // Get CSRF token
        let csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value;
        if (!csrfToken) {
            const cookies = document.cookie.split(';');
            for (let c of cookies) {
                if (c.trim().startsWith('csrftoken=')) {
                    csrfToken = c.trim().substring(10);
                    break;
                }
            }
        }
        
        fetch(`/api/holding/${id}/sell/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken || '{{ csrf_token }}',
            },
            body: JSON.stringify({quantity: qty, amount: amt, reason: document.getElementById('sellReason').value}),
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                if (typeof showToast === 'function') showToast('卖出操作成功', 'success');
                closeSellModal();
                setTimeout(() => location.reload(), 500);
            } else {
                if (typeof showToast === 'function') showToast('卖出失败: ' + data.error, 'error');
                else alert('卖出失败: ' + data.error);
                btn.disabled = false;
                btn.textContent = '确认卖出';
            }
        }).catch(err => {
            if (typeof showToast === 'function') showToast('网络错误: ' + err.message, 'error');
            else alert('网络错误: ' + err.message);
            btn.disabled = false;
            btn.textContent = '确认卖出';
        });
    }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
